name: medic-demo
services:
  cms:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: cms
      args:
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET}
      CMS_URL: ${PUBLIC_ORIGIN}
      SITE_URL: ${PUBLIC_ORIGIN}
      DATABASE_URL: file:/storage/data/clinic.db
      CMS_STORAGE_ROOT: /storage
    volumes:
      - /opt/medic-demo/storage:/storage
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/site').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  site:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: site
      args:
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    restart: unless-stopped
    init: true
    environment:
      SITE_URL: ${PUBLIC_ORIGIN}
      SEO_INDEXABLE: ${SEO_INDEXABLE:-false}
      CMS_INTERNAL_URL: http://cms:3001
    depends_on:
      cms: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4175/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    ports:
      - '${HTTP_BIND:-127.0.0.1:8080}:80'
      - '${HTTPS_BIND:-127.0.0.1:8443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cms: { condition: service_healthy }
      site: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
volumes:
  caddy_data:
  caddy_config:
