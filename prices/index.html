<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Услуги и цены | КСМ</title>
    <script>
      const catalog = new URL('../services/', location.href)
      const section = location.hash.slice(1)
      if (section && section !== 'full-list') catalog.searchParams.set('category', section)
      catalog.hash = section === 'full-list' ? 'full-list' : 'catalog'
      location.replace(catalog)
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=../services/#catalog"></noscript>
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/medic_corp/icons/ksm-v1.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/medic_corp/icons/ksm-v1-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/medic_corp/icons/ksm-v1-180.png">
  </head>
  <body><a href="../services/#catalog">Перейти к услугам и ценам</a></body>
</html>
